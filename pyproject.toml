[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cedar-memory"
version = "0.1.0"
description = "Local-first, explicit memory for Cedar agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cedar_memory = ["py.typed"]

[project.optional-dependencies]
dev = ["ruff==0.16.9", "build>=1.2,<2"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "RUF022"]
